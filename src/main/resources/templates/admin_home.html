<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员主页 - 四级成绩管理系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="navbar">
    <div class="logo">
        <span>📚</span> 四级成绩管理系统 - 管理员
    </div>
    <div class="nav-right">
        <span class="user-name">👤 <span th:text="${session.user.name}">系统管理员</span></span>
        <a href="javascript:void(0)" class="logout-btn" onclick="openChangePwdModal()">🔐 修改密码</a>
        <a th:href="@{/logout}" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="container">
    <div th:if="${message}" class="alert-success" th:text="|✓ ${message}|"></div>
    <div th:if="${error}" class="alert-error" th:text="|⚠️ ${error}|"></div>

    <div class="action-bar">
        <button class="btn btn-primary" onclick="openAddModal()">➕ 录入成绩</button>
        <button class="btn btn-success" onclick="toggleSearch()">🔍 高级查询</button>
        <button class="btn btn-primary" onclick="openImportModal()" style="background:#c49b7a;">📥 批量导入</button>
        <a th:href="@{/admin/downloadTemplate}" class="btn btn-outline btn-sm" style="padding:8px 16px;">📋 下载导入模板</a>
    </div>

    <!-- 多条件查询面板 -->
    <div class="search-panel" id="searchPanel" style="display: none;">
        <div class="search-form">
            <div class="search-item">
                <label>身份证号</label>
                <input type="text" id="searchIdCard" placeholder="请输入身份证号">
            </div>
            <div class="search-item">
                <label>准考证号</label>
                <input type="text" id="searchAdmissionNo" placeholder="请输入准考证号">
            </div>
            <div class="search-item">
                <label>学校</label>
                <input type="text" id="searchSchool" placeholder="请输入学校名称">
            </div>
            <div class="search-item">
                <label>二级学院</label>
                <input type="text" id="searchCollege" placeholder="请输入学院名称">
            </div>
            <div class="search-item">
                <label>专业</label>
                <input type="text" id="searchMajor" placeholder="请输入专业名称">
            </div>
            <div class="search-item">
                <label>班级</label>
                <input type="text" id="searchClass" placeholder="请输入班级名称">
            </div>
            <div class="search-actions">
                <button class="btn btn-primary" onclick="searchScores()">🔍 查询</button>
                <button class="btn btn-outline" onclick="resetSearch()">重置</button>
                <button class="btn btn-success" onclick="exportScores()">📤 导出Excel</button>
            </div>
        </div>
    </div>

    <!-- 成绩列表 -->
    <div class="card">
        <div class="card-header">
            <span>考生成绩列表</span>
            <span style="color:#8ea8b5; font-size:12px">
                共 <span th:text="${scoreList != null ? #lists.size(scoreList) : 0}">0</span> 条记录
            </span>
        </div>
        <div class="card-body">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th><th>姓名</th><th>身份证号</th><th>学校</th><th>学院</th>
                        <th>专业</th><th>班级</th><th>准考证号</th><th>成绩</th><th>考试时间</th><th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="scoreTableBody">
                    <tr th:if="${scoreList == null or scoreList.isEmpty()}">
                        <td colspan="11" style="text-align:center; padding:40px; color:#a8c8d8;">暂无数据</td>
                    </tr>
                    <tr th:each="s : ${scoreList}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.idCardNumber}"></td>
                        <td th:text="${s.school}"></td>
                        <td th:text="${s.college}"></td>
                        <td th:text="${s.major}"></td>
                        <td th:text="${s.className}"></td>
                        <td th:text="${s.admissionNo}"></td>
                        <td th:class="${s.score >= 425 ? 'score-pass' : 'score-fail'}" th:text="${s.score}"></td>
                        <td th:text="${s.examTime}"></td>
                        <td class="action-links">
                            <a class="edit-link" th:onclick="'editScore(' + ${s.id} + ')'">修改</a>
                            <a class="delete-link" th:onclick="'deleteScore(' + ${s.id} + ')'">删除</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 批量导入模态框 -->
<div id="importModal" class="modal">
    <div class="modal-content" style="width: 550px;">
        <div class="modal-header">
            <span>📥 批量导入成绩</span>
            <span class="close" onclick="closeImportModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div style="background:#f5fafc; border:1px solid #d4e0e5; border-radius:8px; padding:12px; margin-bottom:16px; font-size:13px; color:#5a8a9a;">
                <strong>📋 导入说明：</strong>
                <ol style="margin:8px 0 0 16px; line-height:1.8;">
                    <li>请先<a th:href="@{/admin/downloadTemplate}" style="color:#7ab3c8;">下载导入模板</a>，按模板格式填写数据</li>
                    <li>支持 .xlsx 和 .xls 格式的 Excel 文件</li>
                    <li>文件大小不超过 10MB</li>
                    <li>考试时间格式：yyyy-MM-dd（如 2024-06-15）</li>
                    <li>成绩范围：0-710</li>
                    <li>导入成功后会自动为学生创建登录账号（默认密码：123456）</li>
                </ol>
            </div>
            <form id="importForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>选择 Excel 文件 <span class="required">*</span></label>
                    <input type="file" id="excelFile" name="excelFile"
                           accept=".xlsx,.xls"
                           style="max-width:100%; padding:6px;"
                           onchange="updateFileName()">
                </div>
                <div id="fileNameDisplay" style="font-size:12px; color:#8ea8b5; margin-top:-8px;"></div>
            </form>
            <div id="importResult" style="display:none;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeImportModal()">取消</button>
            <button class="btn btn-primary" id="importBtn" onclick="submitImport()" style="background:#c49b7a;">开始导入</button>
        </div>
    </div>
</div>

<!-- 录入/修改成绩模态框 -->
<div id="scoreModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalTitle">录入成绩</span>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="scoreForm" onsubmit="return false;">
                <input type="hidden" name="id" id="scoreId">
                <div class="form-row">
                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <input type="text" name="name" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>身份证号 <span class="required">*</span></label>
                        <input type="text" name="idCardNumber" id="idCardNumber" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>学校 <span class="required">*</span></label>
                        <input type="text" name="school" id="school" required>
                    </div>
                    <div class="form-group">
                        <label>二级学院 <span class="required">*</span></label>
                        <input type="text" name="college" id="college" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>专业 <span class="required">*</span></label>
                        <input type="text" name="major" id="major" required>
                    </div>
                    <div class="form-group">
                        <label>班级 <span class="required">*</span></label>
                        <input type="text" name="className" id="className" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>准考证号 <span class="required">*</span></label>
                        <input type="text" name="admissionNo" id="admissionNo" required>
                    </div>
                    <div class="form-group">
                        <label>成绩 <span class="required">*</span></label>
                        <input type="number" step="0.5" name="score" id="score" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>考试时间 <span class="required">*</span></label>
                    <input type="date" name="examTime" id="examTime" required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitForm()">保存</button>
        </div>
    </div>
</div>

<!-- 修改密码模态框 -->
<div id="changePwdModal" class="modal">
    <div class="modal-content" style="width: 400px;">
        <div class="modal-header">
            <span>修改密码</span>
            <span class="close" onclick="closeChangePwdModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="changePwdForm" th:action="@{/admin/changePassword}" method="post">
                <div class="form-group">
                    <label>原密码 <span class="required">*</span></label>
                    <input type="password" name="oldPassword" id="oldPassword" required placeholder="请输入原密码">
                </div>
                <div class="form-group">
                    <label>新密码 <span class="required">*</span></label>
                    <input type="password" name="newPassword" id="newPassword" required placeholder="请输入新密码">
                </div>
                <div class="form-group">
                    <label>确认新密码 <span class="required">*</span></label>
                    <input type="password" name="confirmPassword" id="confirmPassword" required placeholder="请再次输入新密码">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeChangePwdModal()">取消</button>
            <button class="btn btn-primary" onclick="submitChangePwd()">确认修改</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    var ctx = /*[[@{/}]]*/ '';

    // ========== 批量导入 ==========
    function openImportModal() {
        document.getElementById('importForm').reset();
        document.getElementById('fileNameDisplay').innerText = '';
        document.getElementById('importResult').style.display = 'none';
        document.getElementById('importResult').innerHTML = '';
        document.getElementById('importBtn').disabled = false;
        document.getElementById('importModal').style.display = 'flex';
    }
    function closeImportModal() { document.getElementById('importModal').style.display = 'none'; }
    function updateFileName() {
        var f = document.getElementById('excelFile');
        var d = document.getElementById('fileNameDisplay');
        if (f.files && f.files.length > 0) {
            d.innerText = '已选择：' + f.files[0].name + '（' + formatFileSize(f.files[0].size) + '）';
        } else { d.innerText = ''; }
    }
    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }
    function submitImport() {
        var fileInput = document.getElementById('excelFile');
        if (!fileInput.files || fileInput.files.length === 0) { alert('请先选择 Excel 文件'); return; }
        var file = fileInput.files[0];
        if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) { alert('请选择 .xlsx 或 .xls 格式的文件'); return; }
        if (file.size > 10 * 1024 * 1024) { alert('文件大小不能超过 10MB'); return; }

        var btn = document.getElementById('importBtn');
        btn.disabled = true; btn.innerText = '导入中...';

        var formData = new FormData();
        formData.append('excelFile', file);

        fetch(ctx + 'admin/import', { method: 'POST', credentials: 'same-origin', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            btn.disabled = false; btn.innerText = '开始导入';
            if (data.message === '无权限操作') { alert('登录已过期，请重新登录'); window.location.href = ctx + 'login'; return; }
            var resultDiv = document.getElementById('importResult');
            resultDiv.style.display = 'block';
            if (data.success) {
                var html = '<div class="alert-success" style="margin-top:12px;">✓ ' + escapeHtml(data.message) + '</div>';
                if (data.errors && data.errors.length > 0) {
                    html += '<div style="margin-top:8px; max-height:200px; overflow-y:auto; font-size:12px; color:#d9877a;"><strong>以下行存在格式问题：</strong><ul style="margin:4px 0 0 16px;">';
                    for (var i = 0; i < data.errors.length; i++) html += '<li>' + escapeHtml(data.errors[i]) + '</li>';
                    html += '</ul></div>';
                }
                resultDiv.innerHTML = html;
                setTimeout(function() { window.location.href = ctx + 'admin/home'; }, 2000);
            } else {
                var html = '<div class="alert-error" style="margin-top:12px;">⚠️ ' + escapeHtml(data.message) + '</div>';
                if (data.errors && data.errors.length > 0) {
                    html += '<div style="margin-top:8px; max-height:200px; overflow-y:auto; font-size:12px; color:#d9877a;"><strong>错误详情：</strong><ul style="margin:4px 0 0 16px;">';
                    for (var i = 0; i < data.errors.length; i++) html += '<li>' + escapeHtml(data.errors[i]) + '</li>';
                    html += '</ul></div>';
                }
                resultDiv.innerHTML = html;
            }
        })
        .catch(function(e) { btn.disabled = false; btn.innerText = '开始导入'; alert('导入请求失败：' + e); });
    }

    // ========== 导出 ==========
    function exportScores() {
        var paramMap = {searchIdCard:'idCard', searchAdmissionNo:'admissionNo', searchSchool:'school', searchCollege:'college', searchMajor:'major', searchClass:'className'};
        var params = [];
        Object.keys(paramMap).forEach(function(id) {
            var v = document.getElementById(id).value;
            if (v) params.push(paramMap[id] + '=' + encodeURIComponent(v));
        });
        var url = ctx + 'admin/export';
        if (params.length > 0) url += '?' + params.join('&');
        if (confirm(params.length > 0 ? '将导出当前查询条件下的所有成绩，确定继续？' : '将导出全部成绩，确定继续？')) {
            window.location.href = url;
        }
    }

    // ========== 成绩增删改 ==========
    function submitForm() {
        var form = document.getElementById('scoreForm');
        var formData = new FormData(form);
        fetch(ctx + 'admin/save', { method: 'POST', credentials: 'same-origin', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) { closeModal(); window.location.href = ctx + 'admin/home'; }
            else if (data.message === '无权限操作') { alert('登录已过期'); window.location.href = ctx + 'login'; }
            else { alert(data.message); }
        })
        .catch(function(e) { alert('请求失败：' + e); });
    }
    function openAddModal() {
        document.getElementById('modalTitle').innerText = '录入成绩';
        document.getElementById('scoreForm').reset();
        document.getElementById('scoreId').value = '';
        document.getElementById('scoreModal').style.display = 'flex';
    }
    function editScore(id) {
        fetch(ctx + 'admin/getScore?id=' + id)
        .then(r => r.json())
        .then(data => {
            document.getElementById('modalTitle').innerText = '修改成绩';
            document.getElementById('scoreId').value = data.id;
            document.getElementById('name').value = data.name;
            document.getElementById('idCardNumber').value = data.idCardNumber;
            document.getElementById('school').value = data.school;
            document.getElementById('college').value = data.college;
            document.getElementById('major').value = data.major;
            document.getElementById('className').value = data.className;
            document.getElementById('admissionNo').value = data.admissionNo;
            document.getElementById('score').value = data.score;
            var d = new Date(data.examTime);
            document.getElementById('examTime').value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            document.getElementById('scoreModal').style.display = 'flex';
        })
        .catch(e => { alert('获取数据失败：' + e); });
    }
    function deleteScore(id) {
        if (confirm('确定要删除这条成绩记录吗？')) {
            window.location.href = ctx + 'admin/delete?id=' + id;
        }
    }
    function toggleSearch() {
        var p = document.getElementById('searchPanel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }
    function resetSearch() {
        ['searchIdCard','searchAdmissionNo','searchSchool','searchCollege','searchMajor','searchClass'].forEach(function(id) {
            document.getElementById(id).value = '';
        });
        searchScores();
    }
    function searchScores() {
        var params = [];
        var map = {searchIdCard:'idCard', searchAdmissionNo:'admissionNo', searchSchool:'school', searchCollege:'college', searchMajor:'major', searchClass:'className'};
        Object.keys(map).forEach(function(id) {
            var v = document.getElementById(id).value;
            params.push(map[id] + '=' + encodeURIComponent(v));
        });
        window.location.href = ctx + 'admin/search?' + params.join('&');
    }
    function closeModal() { document.getElementById('scoreModal').style.display = 'none'; }

    // 修改密码
    function openChangePwdModal() {
        document.getElementById('changePwdForm').reset();
        document.getElementById('changePwdModal').style.display = 'flex';
    }
    function closeChangePwdModal() { document.getElementById('changePwdModal').style.display = 'none'; }
    function submitChangePwd() {
        var oldPwd = document.getElementById('oldPassword').value;
        var newPwd = document.getElementById('newPassword').value;
        var confirmPwd = document.getElementById('confirmPassword').value;
        if (!oldPwd || !newPwd || !confirmPwd) { alert('请填写完整信息'); return; }
        if (newPwd !== confirmPwd) { alert('两次输入的新密码不一致'); return; }
        if (newPwd.length < 6) { alert('新密码长度不能少于6位'); return; }
        document.getElementById('changePwdForm').submit();
    }
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) event.target.style.display = 'none';
    }
</script>
</body>
</html>
